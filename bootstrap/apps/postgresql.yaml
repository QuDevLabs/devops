apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://github.com/QuDevLabs/devops.git
    targetRevision: main
    path: infra/postgresql
    helm:
      releaseName: postgresql
      valueFiles:
      - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: postgresql
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  ignoreDifferences:
  - group: ""
    kind: Secret
    name: postgresql-credentials
    jsonPointers:
    - /data
